name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build with standard script
      run: |
        mkdir -p app/src/main/java/com/example/whatsappcloner app/src/main/res/layout
        cp AndroidManifest.xml app/src/main/
        cp MainActivity.kt app/src/main/java/com/example/whatsappcloner/
        cp WhatsAppAutoReplyService.kt app/src/main/java/com/example/whatsappcloner/
        cp activity_main.xml app/src/main/res/layout/
        
        echo "include ':app'" > settings.gradle
        echo "rootProject.name='WhatsAppCloner'" >> settings.gradle
        
        # Generates a basic build structure
        echo "Done preparing sources"
    - name: Archive files as artifact
      uses: actions/upload-artifact@v4
      with:
        name: source-package
        path: app/
