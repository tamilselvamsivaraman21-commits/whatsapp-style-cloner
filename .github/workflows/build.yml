name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Proper App Structure & Build
      run: |
        mkdir -p app/src/main/java/com/example/whatsappcloner app/src/main/res/layout
        
        # Move files to correct Android project paths if they are in root
        if [ -f "AndroidManifest.xml" ]; then cp AndroidManifest.xml app/src/main/; fi
        if [ -f "MainActivity.kt" ]; then cp MainActivity.kt app/src/main/java/com/example/whatsappcloner/; fi
        if [ -f "WhatsAppAutoReplyService.kt" ]; then cp WhatsAppAutoReplyService.kt app/src/main/java/com/example/whatsappcloner/; fi
        if [ -f "activity_main.xml" ]; then cp activity_main.xml app/src/main/res/layout/; fi

        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.whatsappcloner'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.whatsappcloner"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:app-compat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

        chmod +x gradlew || gradle wrapper
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/outputs/apk/debug/*.apk'
